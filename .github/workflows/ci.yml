name: CI

on:
  push:
  pull_request:

jobs:
  meeting:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://meeting:meeting@localhost:5432/meeting
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify meeting bot production dependencies
        run: pnpm list --prod @playwright/test --depth 0
      - name: Check meeting bot scripts
        run: |
          for file in scripts/meeting-bot-*.mjs; do
            node --check "$file"
          done
      - run: pnpm run prisma:generate
      - run: pnpm run meeting:check-brand
      - run: pnpm run prisma:validate
      - run: pnpm run test
      - run: pnpm run typecheck
      - run: pnpm run build
